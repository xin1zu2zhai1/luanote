<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="LuaNote — ブラウザだけで動く LuaLaTeX エディタ（TeX Live WASM）" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23000080'/%3E%3Ccircle cx='22' cy='10' r='5' fill='white'/%3E%3C/svg%3E" />
    <title>LuaNote</title>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="logo" aria-hidden="true"></span>
        <span class="brand-name">LuaNote</span>
      </div>
      <button id="project-btn" class="ghost project-btn" title="プロジェクト一覧">
        <span id="project-name">—</span> <span class="caret">▾</span>
      </button>
      <div class="spacer"></div>
      <div class="engine-group" title="TeX ディストリビューションとパッケージセット">
        <span class="engine-badge">LuaLaTeX</span>
        <select id="dist-select" aria-label="TeX Live のバージョン"></select>
        <select id="pkg-select" aria-label="パッケージセット"></select>
      </div>
      <label class="auto-toggle" title="入力が止まったら自動でコンパイル">
        <input type="checkbox" id="auto-compile" /> 自動
      </label>
      <div class="split-btn">
        <button id="compile-btn" class="primary" title="コンパイル (Ctrl+S / Ctrl+Enter)">
          <span class="play">▶</span> <span id="compile-label">コンパイル</span>
        </button>
        <button id="compile-menu-btn" class="primary caret-btn" title="その他のコンパイル" aria-label="その他のコンパイル">▾</button>
      </div>
      <button id="settings-btn" class="ghost icon-btn" title="設定" aria-label="設定">⚙</button>
    </header>

    <nav class="mobile-tabs" role="tablist">
      <button data-pane="tree" role="tab">ファイル</button>
      <button data-pane="editor" role="tab" class="active">ソース</button>
      <button data-pane="preview" role="tab">PDF</button>
    </nav>

    <main class="workspace" id="workspace">
      <section class="pane pane-tree" id="pane-tree" data-pane="tree">
        <div class="pane-header">
          <span class="pane-title">ファイル</span>
          <div class="pane-actions">
            <button id="new-file-btn" class="ghost icon-btn" title="新規ファイル" aria-label="新規ファイル">＋</button>
            <button id="new-folder-btn" class="ghost icon-btn" title="新規フォルダ" aria-label="新規フォルダ">📁</button>
            <button id="upload-btn" class="ghost icon-btn" title="アップロード（画像・フォント・.sty など）" aria-label="アップロード">⤒</button>
            <input type="file" id="upload-input" multiple hidden />
          </div>
        </div>
        <div class="tree" id="tree"></div>
        <div class="pane-footer" id="tree-footer"></div>
      </section>

      <div class="gutter" data-gutter="tree" role="separator" aria-orientation="vertical"></div>

      <section class="pane pane-editor" id="pane-editor" data-pane="editor">
        <div class="pane-header">
          <span class="pane-title path" id="editor-path">—</span>
          <div class="pane-actions">
            <button id="forward-sync-btn" class="ghost" title="カーソル位置を PDF で表示 (Ctrl+Alt+J)">→ PDF</button>
          </div>
        </div>
        <div class="editor-host" id="editor-host"></div>
        <div class="binary-view" id="binary-view" hidden></div>
      </section>

      <div class="gutter" data-gutter="editor" role="separator" aria-orientation="vertical"></div>

      <section class="pane pane-preview" id="pane-preview" data-pane="preview">
        <div class="pane-header">
          <div class="pane-actions left">
            <button id="zoom-out" class="ghost icon-btn" title="縮小" aria-label="縮小">−</button>
            <button id="zoom-label" class="ghost zoom-label" title="幅に合わせる / ページ全体">100%</button>
            <button id="zoom-in" class="ghost icon-btn" title="拡大" aria-label="拡大">＋</button>
          </div>
          <div class="spacer"></div>
          <div class="pane-actions">
            <button id="log-btn" class="ghost" title="ログとエラー">ログ <span id="issue-badge" class="issue-badge" hidden></span></button>
            <button id="download-pdf" class="ghost" title="PDF をダウンロード" disabled>⤓ PDF</button>
          </div>
        </div>
        <div class="preview-body">
          <div class="pdf-host" id="pdf-host"></div>
          <div class="preview-overlay" id="preview-overlay" hidden></div>
          <div class="log-panel" id="log-panel" hidden>
            <div class="log-tabs">
              <button data-log-tab="issues" class="active">エラーと警告</button>
              <button data-log-tab="raw">生ログ</button>
              <div class="spacer"></div>
              <button id="log-close" class="ghost icon-btn" aria-label="閉じる">×</button>
            </div>
            <div class="log-issues" id="log-issues"></div>
            <pre class="log-raw" id="log-raw" hidden></pre>
          </div>
        </div>
      </section>
    </main>

    <footer class="statusbar">
      <span id="engine-status" class="status-item">エンジン未起動</span>
      <span id="compile-status" class="status-item"></span>
      <div class="spacer"></div>
      <span class="status-item muted">すべてブラウザ内で処理（サーバー送信なし）</span>
    </footer>

    <dialog id="dialog" class="dialog"></dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
